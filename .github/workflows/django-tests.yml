name: Django tests and real screenshots

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Verify checked-in migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Validate application
        run: |
          python manage.py check
          python manage.py test
      - name: Install screenshot browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Django and capture real browser screenshots
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py runserver 127.0.0.1:8000 > /tmp/onlinecourse-server.log 2>&1 &
          python scripts/capture_evidence.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlinecourse-real-screenshots
          path: evidence/*.png
          if-no-files-found: warn
