{% extends 'onlinecourse/base.html' %}
{% block title %}Sign in | OnlineCourse{% endblock %}
{% block content %}
  <div class="card auth-card border-0 shadow-sm mx-auto"><div class="card-body p-4">
    <h1 class="h3 mb-3">Sign in</h1>
    <form method="post">
      {% csrf_token %}
      <label class="form-label" for="login-username">Username</label>
      <input class="form-control mb-3" id="login-username" name="username" required autocomplete="username">
      <label class="form-label" for="login-password">Password</label>
      <input class="form-control mb-3" id="login-password" name="psw" type="password" required autocomplete="current-password">
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="mt-3 mb-0 small">New student? <a href="{% url 'onlinecourse:registration' %}">Create an account</a></p>
  </div></div>
{% endblock %}
