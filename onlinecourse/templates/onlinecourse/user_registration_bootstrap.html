{% extends 'onlinecourse/base.html' %}
{% block title %}Create account | OnlineCourse{% endblock %}
{% block content %}
  <div class="card auth-card border-0 shadow-sm mx-auto"><div class="card-body p-4">
    <h1 class="h3 mb-3">Create a learner account</h1>
    <form method="post">
      {% csrf_token %}
      <label class="form-label" for="reg-first">First name</label>
      <input class="form-control mb-3" id="reg-first" name="firstname" autocomplete="given-name">
      <label class="form-label" for="reg-last">Last name</label>
      <input class="form-control mb-3" id="reg-last" name="lastname" autocomplete="family-name">
      <label class="form-label" for="reg-user">Username</label>
      <input class="form-control mb-3" id="reg-user" name="username" required autocomplete="username">
      <label class="form-label" for="reg-pwd">Password</label>
      <input class="form-control mb-3" id="reg-pwd" name="psw" type="password" required autocomplete="new-password">
      <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
  </div></div>
{% endblock %}
